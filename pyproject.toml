[project]
name = "lakenterprises"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thedataai2025v1", email = "thedataai2025@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "langchain>=1.5.2",
    "langgraph>=1.2.24",
    "openai>=3.57.0",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
lakenterprises = "lakenterprises:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
