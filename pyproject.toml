[project]
name = "lakenterprises"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thedataai2025v1", email = "thedataai2025@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fakeredis>=2.41.0",
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langgraph>=1.2.24",
    "openai>=3.57.0",
    "passlib>=1.9.5",
    "pyjwt>=2.15.1",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
lakenterprises = "lakenterprises:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.10.1",
    "flake8>=7.5.0",
    "isort>=9.0.2",
    "pip-audit>=2.10.1",
    "safety>=3.8.1",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B104", "B105", "B106", "B110"]

[tool.isort]
profile = "black"
line_length = 88

